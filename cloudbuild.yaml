# ============================================================
# LegacyLens — Cloud Build config for GCP Cloud Run
# Builds Docker image, pushes to Artifact Registry, deploys.
# ============================================================

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_CLERK_PUBLISHABLE_KEY=${_VITE_CLERK_PUBLISHABLE_KEY}'
      - '--build-arg'
      - 'VITE_API_URL=https://${_API_DOMAIN}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/legacylens:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/legacylens:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/legacylens'

  # Deploy API server to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'legacylens-api'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/legacylens:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'NODE_ENV=production,FRONTEND_URL=https://${_FRONTEND_DOMAIN}'
      - '--update-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,COHERE_API_KEY=COHERE_API_KEY:latest,B2_KEY_ID=B2_KEY_ID:latest,B2_APPLICATION_KEY=B2_APPLICATION_KEY:latest,B2_BUCKET_NAME=B2_BUCKET_NAME:latest,B2_BUCKET_ID=B2_BUCKET_ID:latest'

  # Deploy Worker to Cloud Run (always-on, min 1 instance)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'legacylens-worker'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/legacylens:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--command'
      - 'node'
      - '--args'
      - 'dist/workers/index.js'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--update-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,GROQ_API_KEY=GROQ_API_KEY:latest,COHERE_API_KEY=COHERE_API_KEY:latest,B2_KEY_ID=B2_KEY_ID:latest,B2_APPLICATION_KEY=B2_APPLICATION_KEY:latest,B2_BUCKET_NAME=B2_BUCKET_NAME:latest,B2_BUCKET_ID=B2_BUCKET_ID:latest'

substitutions:
  _REGION: 'us-central1'
  _REPO: 'legacylens'
  _API_DOMAIN: 'legacylens-api-xxxx-uc.a.run.app'      # Replace with your Cloud Run API URL
  _FRONTEND_DOMAIN: 'legacylens-api-xxxx-uc.a.run.app' # Same as API (SPA served from same container)
  _VITE_CLERK_PUBLISHABLE_KEY: 'pk_live_...'            # Replace with your Clerk publishable key

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/legacylens'

options:
  logging: CLOUD_LOGGING_ONLY
